name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release / both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK (MultiGauge OBD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build:android:web

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Restore Capacitor Android Binary Assets
        shell: bash
        run: |
          template_dir="${RUNNER_TEMP}/capacitor-android-template"
          mkdir -p "${template_dir}"
          tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C "${template_dir}"

          while IFS= read -r -d '' source_file; do
            relative_path="${source_file#"${template_dir}/app/src/main/res/"}"
            install -Dm0644 "${source_file}" "android/app/src/main/res/${relative_path}"
          done < <(find "${template_dir}/app/src/main/res" -type f -name '*.png' -print0)

      - name: Verify Gradle Wrapper Integrity
        run: echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Build Android Release APK (Unsigned)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: MultiGauge-OBD-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: MultiGauge-OBD-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
